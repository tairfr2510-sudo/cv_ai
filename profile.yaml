      - "Wet Lab: Prepared gel-based tissue-mimicking solutions in a chemical fume hood, following lab safety protocols."
      - "MRI: Supported T1/T2 MRI scanning of gel-filled phantoms at the Technion MRI lab."
      - "Analysis: Evaluated the image quality of phantom scans using signal-to-noise ratio (SNR) and signal-quality analysis."
      - "Experiment Design: Planned phantom experiments end-to-end, from MRI data through printed phantom to scan and analysis."
    matching:
