    title: Research Assistant (Student)
    role_short: Research Assistant
    company: MedAILab – Technion MRI
    location: Faculty of Electrical Engineering, Technion
    dates_fact: 07/2026 - Present
    dates_tex: 07/2026 -- Present
    bullets: [3, 4]
    # One line for job_agent's relevance scoring (not printed on the CV)
    summary: "Python tool that turns brain MRI into 3D-printable phantoms (K-Means tissue segmentation, STL generation); SolidWorks and 3D printing; gel-based tissue-mimicking phantoms; supports T1/T2 MRI scans and SNR analysis."
    facts:
      - "Tech Stack: Python, nibabel, scikit-image, scikit-learn, scipy, shapely, trimesh, Tkinter, matplotlib, SolidWorks, 3D printing."
      - "Phantom Generator: Developed a Python desktop tool (Tkinter GUI) that turns brain MRI scans (NIfTI) into 3D-printable phantom models, automating the path from scan to physical model for the lab's MRI experiments."
